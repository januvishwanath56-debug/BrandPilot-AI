# Optional Render Blueprint. Never place private keys or the Neon DATABASE_URL here.
services:
  - type: web
    name: brandpilot-ai-demo
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: OPENROUTER_MODEL
        value: openrouter/free
      - key: AI_DEMO_DAILY_LIMIT
        value: '35'
      - key: AI_DEMO_SESSION_LIMIT
        value: '4'
